theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.tabs.sticky
    - navigation.expand
    - content.code.copy
    - content.tabs.link


  # Fonts are self-hosted via stylesheets/fonts/fonts.css
  font: false

  # Default assets (the header stays dark in both schemes, so one glyph serves both)
  favicon: assets/favicon.svg
  logo: assets/glyph_phase_dark.png

  # The toggle icon shows the current mode, matching the project website
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - markdown_include.include:
      base_path: docs
  - pymdownx.extra
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# footer:
extra:
  generator: false
  social:
    - icon: material/web
      link: https://proteus-framework.org/
      name: PROTEUS website
    - icon: material/email
      link: mailto:dev@proteus-framework.org
      name: Mail PROTEUS developers
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fwl-proteus/
      name: PROTEUS on PyPI
    - icon: fontawesome/brands/github
      link: https://github.com/FormingWorlds/SOCRATES
      name: SOCRATES on GitHub

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/header-links.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/layout.css
  - stylesheets/footnotes.css
  - stylesheets/subtitle.css

plugins:
  - search
  
use_directory_urls: false

watch:
  - src/
  - docs/
  - README.md
